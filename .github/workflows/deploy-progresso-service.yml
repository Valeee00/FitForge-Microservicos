# CI/CD do progresso-service -> Azure Web App (Java SE 21)
# Configuração no GitHub (Settings -> Secrets and variables -> Actions):
#   Secrets   -> AZURE_PUBLISHPROFILE_PROGRESSO: conteúdo do .PublishSettings do Web App
#   Variables -> AZURE_WEBAPP_PROGRESSO: nome do Web App no Azure
name: Deploy progresso-service

on:
  push:
    branches: [ main ]
    paths:
      - 'progresso-service/**'
      - 'pom.xml'
      - '.github/workflows/deploy-progresso-service.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build + testes do progresso-service
        run: mvn -B clean package -pl progresso-service -am

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: progresso-service
          path: progresso-service/target/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar o JAR
        uses: actions/download-artifact@v4
        with:
          name: progresso-service

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_PROGRESSO }}
          publish-profile: ${{ secrets.AZURE_PUBLISHPROFILE_PROGRESSO }}
          package: '*.jar'
