server:
  port: ${PORT:8082}

spring:
  application:
    name: progresso-service
  datasource:
    # Database per service: banco exclusivo do progresso-service.
    # Local/testes: H2 em memória. Azure: Azure SQL Database (gratuito), configurado por variáveis:
    #   DB_URL=jdbc:sqlserver://<servidor>.database.windows.net:1433;database=fitforge-progresso;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=60;
    #   DB_USERNAME=fitforgeadmin   DB_PASSWORD=<senha>
    url: ${DB_URL:jdbc:h2:mem:progressodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # O Azure SQL gratuito "dorme" após 15 min sem uso e leva ~1 min para acordar:
      # o pool espera em vez de derrubar o app na inicialização.
      connection-timeout: 60000
      initialization-fail-timeout: 120000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
      path: /h2-console
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  seed: ${SEED_DATA:true}
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  openapi:
    server-url: ${OPENAPI_SERVER_URL:}
  servicebus:
    # Vazia = mensageria desligada (execução local/testes)
    connection-string: ${SERVICEBUS_CONNECTION_STRING:}
    fila-fichas: ${SERVICEBUS_FILA_FICHAS:fichas-eventos}
    fila-sessoes: ${SERVICEBUS_FILA_SESSOES:sessoes-eventos}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.azurestaticapps.net,https://*.azurewebsites.net,https://*.web.core.windows.net}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
